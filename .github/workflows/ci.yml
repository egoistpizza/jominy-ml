name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make install PY=python
      - run: make check PY=python
      - run: make results PY=python
      - uses: actions/upload-artifact@v7
        with:
          name: results
          path: results
